<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TL;DW promotional tile</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 215, 64, .20), transparent 34%),
        radial-gradient(circle at 86% 88%, rgba(99, 102, 241, .30), transparent 40%),
        linear-gradient(145deg, #11131b 0%, #171b2b 58%, #10121a 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 392px;
      height: 232px;
      padding: 30px 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 24px 60px rgba(0,0,0,.32);
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .icon {
      display: grid;
      width: 60px;
      height: 60px;
      place-items: center;
      border-radius: 17px;
      background: linear-gradient(145deg, #ffe66b, #ffb800);
      color: #17120a;
      font-size: 36px;
      box-shadow: 0 12px 26px rgba(255, 184, 0, .23);
    }
    h1 { margin: 0; font-size: 42px; letter-spacing: -2px; }
    p { margin: 22px 0 0; color: #d4d7e5; font-size: 21px; line-height: 1.34; letter-spacing: -.3px; }
    .accent { color: #ffe052; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="icon">⚡</div>
      <h1>TL;DW</h1>
    </div>
    <p>Turn long YouTube videos into <span class="accent">clear AI summaries</span>.</p>
  </main>
</body>
</html>
